name: Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan published source and archive
        run: python3 scripts/check-secrets.py
      - name: Scan full Git history
        run: gitleaks git --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner --max-archive-depth=3 --timeout=120 .
      - name: Install public build dependencies
        run: npm ci --registry=https://registry.npmjs.org --ignore-scripts
      - name: Check and test extension source
        run: |
          npm run check
          npm test
      - name: Test artifact validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build extension from published source
        run: npm run build
      - name: Compare source build with release archive
        run: |
          cmp build/budetoffer-chrome.zip distribution/budetoffer-chrome.zip
          cmp build/SHA256SUMS distribution/SHA256SUMS
          cmp build/release.json distribution/release.json
      - name: Validate public package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/validate-release.py --tag "$RELEASE_TAG"
          else
            python3 scripts/validate-release.py
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag package
        run: python3 scripts/validate-release.py --tag "$RELEASE_TAG"
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          test -s release-notes.md
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          python3 - "$RUNNER_TEMP/existing-releases.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          pages = json.loads(Path(sys.argv[1]).read_text())
          if any(release["tag_name"] == os.environ["RELEASE_TAG"] for page in pages for release in page):
              raise SystemExit("A release already exists for this tag. Refusing to overwrite assets or publish an existing draft.")
          PY
          gh release create "$RELEASE_TAG" \
            distribution/budetoffer-chrome.zip distribution/SHA256SUMS distribution/release.json \
            --draft --verify-tag --title "Chrome companion ${RELEASE_TAG#v}" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/release-state.json"
          python3 - "$RUNNER_TEMP/release-state.json" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path(sys.argv[1]).read_text())
          expected = {"budetoffer-chrome.zip", "SHA256SUMS", "release.json"}
          assets = state["assets"]
          if not state["isDraft"] or len(assets) != len(expected) or {item["name"] for item in assets} != expected:
              raise SystemExit("Draft release assets do not match the validated package")
          PY
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          for asset in budetoffer-chrome.zip SHA256SUMS release.json; do
            cmp "distribution/$asset" "$RUNNER_TEMP/release-assets/$asset"
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
