name: Ошибка
description: Сообщить о проблеме с расширением или инструкцией.
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Сначала проверьте [последнюю версию](https://github.com/poizoncc/budetoffer/releases/latest) и [инструкцию](https://github.com/poizoncc/budetoffer/blob/main/docs/troubleshooting.md).
        Обращение публичное. Не прикладывайте резюме, пароли, коды входа, cookies, токены или содержимое хранилища расширения. Об уязвимости сообщайте по [SECURITY.md](https://github.com/poizoncc/budetoffer/blob/main/SECURITY.md).
  - type: input
    id: extension-version
    attributes:
      label: Версия BudetOffer
      description: Номер на карточке расширения в chrome://extensions.
      placeholder: "Например, 0.2.4"
    validations:
      required: true
  - type: input
    id: browser-system
    attributes:
      label: Версия Chrome и операционная система
      placeholder: "Например, Chrome 130, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: На каком этапе возникла проблема?
      options:
        - Установка или обновление
        - Открытие расширения
        - Получение или подтверждение кода
        - Проверка резюме HH
        - Импорт профиля
        - Чтение результатов откликов
        - Инструкция или другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Перечислите шаги до появления ошибки без личных данных и секретных ссылок.
      placeholder: |
        1. Открыл…
        2. Нажал…
        3. Увидел…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и текст ошибки
      description: Скройте личные данные на скриншотах. Полный сетевой журнал не нужен.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил сообщение и вложения и удалил личные данные, коды входа, cookies и токены.
          required: true
