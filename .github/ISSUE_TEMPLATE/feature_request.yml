name: Предложение
description: Рассказать, какую задачу стоит упростить.
title: "[Предложение] "
body:
  - type: markdown
    attributes:
      value: |
        Опишите вашу задачу и желаемый результат. Предложение публичное: не добавляйте личные данные, текст резюме, коды входа или секреты.
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу вы решаете?
      description: В какой ситуации возникает трудность и что сейчас приходится делать?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Какой результат нужен?
      description: Что должно стать проще или понятнее?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ваш вариант решения
      description: Необязательно. Можно описать пример сценария или приложить схему без личных данных.
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил сообщение и вложения и удалил личные данные и секреты.
          required: true
